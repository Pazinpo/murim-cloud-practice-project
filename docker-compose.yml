version: '3.8'  # 버전을 명시하여 환경의 일관성을 유지합니다.

services:
  # 1. Database 계층 (MariaDB)
  my-db:
    image: mariadb:latest
    container_name: murim-db
    restart: always  # 서버 재부팅 시 자동으로 다시 켜지게 설정
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "murim_db"
    ports:
      - "3306:3306"
    volumes:
      - ./my_db_data:/var/lib/mysql

  # 2. Application 계층 (FastAPI)
  murim-backend:
    image: python:3.9-slim
    container_name: murim-backend
    restart: always
    volumes:
      - ./backend:/app
    working_dir: /app
    # 패키지 설치는 운영 환경에서는 Dockerfile로 옮기는 것이 좋으나, 
    # 현재 구조 유지를 위해 줄바꿈만 정리했습니다.
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn pymysql && 
             uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - DB_HOST=murim-db  
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - my-db

  # 3. Web 계층 (Nginx)
  my-web:
    image: nginx:latest
    container_name: murim-web
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # ro(Read-Only) 추가로 보안 강화
    depends_on:
      - murim-backend

  # 4. 모니터링 - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: murim-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # 5. 모니터링 - node-exporter (호스트 메트릭)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: murim-node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

  # 6. 모니터링 - cAdvisor (컨테이너 메트릭)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: murim-cadvisor
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

  # 7. 모니터링 - Grafana (시각화 대시보드)
  grafana:
    image: grafana/grafana:latest
    container_name: murim-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus


volumes:
  prometheus_data:
  grafana_data:
